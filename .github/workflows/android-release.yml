name: Build Android APK

on:
  workflow_dispatch:        # 手动触发
  push:
    branches: [ main ]      # 推 main 自动触发 debug 包
    tags: [ 'v*' ]          # 打 v 标签触发 release 包

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 若配置了 BUILTIN_PASSCODE Secret，则注入"口令一键授权"内置配置
      # （口令 + API Key 仅存于 GitHub Secrets，仓库源码不含；生成文件不入库）
      - name: Inject builtin one-key config
        env:
          BUILTIN_PASSCODE: ${{ secrets.BUILTIN_PASSCODE }}
          DIFY_API_KEY: ${{ secrets.DIFY_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          VOICE_BOY: ${{ secrets.VOICE_BOY }}
          VOICE_GIRL: ${{ secrets.VOICE_GIRL }}
        shell: bash
        run: |
          if [ -z "${BUILTIN_PASSCODE}" ]; then
            echo "未设置 BUILTIN_PASSCODE，跳过内置授权配置注入"
            exit 0
          fi
          mkdir -p app/src/main/assets
          cat > app/src/main/assets/builtin_config.json <<JSON
          {
            "passcode": "${BUILTIN_PASSCODE}",
            "config": {
              "difyEndpoint": "https://api.dify.ai/v1",
              "difyApiKey": "${DIFY_API_KEY}",
              "ttsProvider": "minimax",
              "ttsApiKey": "${MINIMAX_API_KEY}",
              "voiceBoy": "${VOICE_BOY}",
              "voiceGirl": "${VOICE_GIRL}",
              "userName": "",
              "autoSpeak": true
            }
          }
          JSON
          echo "已注入内置授权配置（口令保护）"

      - name: Build Debug APK
        run: |
          if [ ! -f gradlew ]; then gradle wrapper --gradle-version 8.9; fi
          ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: sunny-companion-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      # 打 tag v1.0.0 等时，自动发布到 GitHub Releases（含直链下载）
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
